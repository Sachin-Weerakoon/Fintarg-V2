<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none" width="240" height="56">
  <defs>
    <linearGradient id="fintarg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0FA3B1" />
      <stop offset="100%" stop-color="#0A6D78" />
    </linearGradient>
    <filter id="fintarg-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F1D32" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g filter="url(#fintarg-shadow)">
    <rect x="4" y="6" width="44" height="44" rx="12" fill="url(#fintarg-grad)" />
    <!-- Bolt Symbol -->
    <path d="M28 14L16 28h10l-2 14 12-14H26l2-14z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5" stroke-linejoin="round" />
  </g>

  <!-- Wordmark "Fintarg" -->
  <text x="60" y="36" font-family="Poppins, system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" fill="currentColor" letter-spacing="-0.5">
    Fintarg
  </text>

  <!-- Version / Tag Badge -->
  <rect x="168" y="21" width="42" height="18" rx="5" fill="#0FA3B1" fill-opacity="0.15" stroke="#0FA3B1" stroke-opacity="0.35" stroke-width="1" />
  <text x="175" y="34" font-family="Poppins, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0FA3B1" letter-spacing="0.5">
    v2.0
  </text>
</svg>
